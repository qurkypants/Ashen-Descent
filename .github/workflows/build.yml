name: Build Ashen Descent APK + XAPK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack game source
        run: unzip -q AshenDescent_0.4.1_GitHub_Actions_Ready.zip -d source

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: source/AshenDescent-GitHub-Actions

      - name: Build XAPK
        run: python3 scripts/make_xapk.py
        working-directory: source/AshenDescent-GitHub-Actions

      - name: Upload APK and XAPK
        uses: actions/upload-artifact@v4
        with:
          name: AshenDescent-Android-0.4.1
          path: source/AshenDescent-GitHub-Actions/output/*
          if-no-files-found: error
          
